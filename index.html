<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Course 55">
<title>NPF Course 55 App</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: phone-first register. Slim header with the force tri-colour strip, one scrolling column, tab bar fixed at the bottom. */
:root{
  --bg:#edf0f6; --surface:#ffffff; --ink:#101b33; --muted:#566180; --line:#d3d9e6;
  --accent:#1d3f8f; --accent-ink:#ffffff; --tint:#e2e9fa;
  --gold:#d2a516; --green:#1c7a4a; --warn:#9a5a06; --bad:#a8322d; --gone:#5d6373;
  --display:"Archivo","Arial Narrow",Arial,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0b111e; --surface:#141c2e; --ink:#e8ecf6; --muted:#9aa6c0; --line:#283350;
  --accent:#86a7ff; --accent-ink:#0b111e; --tint:#1c2848;
  --gold:#e3b93a; --green:#5cc490; --warn:#e3a550; --bad:#f0857e; --gone:#a2a8b8; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0b111e; --surface:#141c2e; --ink:#e8ecf6; --muted:#9aa6c0; --line:#283350;
  --accent:#86a7ff; --accent-ink:#0b111e; --tint:#1c2848;
  --gold:#e3b93a; --green:#5cc490; --warn:#e3a550; --bad:#f0857e; --gone:#a2a8b8; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:12px;padding-block:14px}
header h1{font:700 20px/1.15 var(--display);margin:0;text-wrap:balance;min-width:0;flex:1}
header p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.logo{width:46px;height:46px;border-radius:50%;flex:none}
.strip{height:4px;background:linear-gradient(90deg,var(--accent) 0 34%,var(--gold) 34% 67%,var(--green) 67%)}
.badge:disabled{opacity:1;cursor:default}
.badge{border:0;font:600 11px var(--body);letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border-radius:99px;background:var(--tint);color:var(--accent);white-space:nowrap}

main{padding-block:18px 104px;display:flex;flex-direction:column;gap:16px}
h2{font:700 18px/1.2 var(--display);margin:0}
h3{font:600 12px var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.note{color:var(--muted);font-size:13.5px;margin:0}
.banner{background:var(--tint);border-radius:10px;padding:10px 12px;font-size:13.5px}
.banner.publish{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pad{padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.figures{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.figures div{padding:10px 12px;min-width:0}
.figures div+div{border-left:1px solid var(--line)}
.figures b{display:block;font:700 17px var(--display);font-variant-numeric:tabular-nums}
.figures span{font-size:12px;color:var(--muted)}
.big{font:700 30px/1.1 var(--display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.in{color:var(--green)} .out{color:var(--bad)}

.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 14px}
.row:first-child{border-top:0}
button.row:hover{background:var(--tint)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row-main b{font-weight:600;overflow-wrap:anywhere}
.row-main small{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.pill{font:600 11.5px var(--body);padding:3px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.pill.serving,.pill.paid,.pill.open{color:var(--green)}
.pill.retired,.pill.unpaid{color:var(--warn)}
.pill.deceased,.pill.closed{color:var(--gone)}
.pill.type{color:var(--accent)}
.gate label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500;color:var(--muted)}
.sel{user-select:all;-webkit-user-select:all}
.pill.helped{align-self:flex-start;margin-top:4px;color:var(--accent);background:var(--tint);border-color:transparent;white-space:normal}

.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px}
.between{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.search{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}

.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:9px 14px;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.small{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.55}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600}

.empty{padding:26px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:600 16px var(--display);margin-bottom:4px}
.notice-body{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav .wrap{display:grid;grid-template-columns:repeat(5,1fr)}
nav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;color:var(--muted);text-decoration:none;font-size:11px;font-weight:500;min-width:0}
nav a[aria-current="page"]{color:var(--accent);font-weight:600}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

dialog{border:0;padding:0;background:var(--surface);color:var(--ink);width:100%;max-width:520px;max-height:88dvh;border-radius:16px 16px 0 0;margin:auto auto 0;overflow:auto}
dialog::backdrop{background:rgba(5,10,25,.55)}
@media (min-width:600px){ dialog{margin:auto;border-radius:16px} }
.sheet{padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500;color:var(--muted)}
.sheet input,.sheet select,.sheet textarea{padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);width:100%}
.sheet textarea{min-height:96px;resize:vertical}
.sheet .check{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
.sheet .check input{width:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>*{min-width:0}
.err{color:var(--bad);font-size:13.5px;margin:0}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
dt{color:var(--muted)} dd{margin:0;overflow-wrap:anywhere}
@media (prefers-reduced-motion:no-preference){ .bar i{transition:width .3s} }
</style>
</head>

<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const naira=n=>'₦'+Math.round(Number(n)||0).toLocaleString('en-NG');
const ftime=t=>{ const d=new Date(t); return isNaN(d)?'':d.toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'}); };
const fdate=d=>{ if(!d) return ''; const t=new Date(d+'T00:00:00'); return isNaN(t)?String(d):t.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); };
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const VIEWS=['home','members','contributions','account','notices'];
const RANKS=['Constable','Corporal','Sergeant','Inspector','ASP','DSP','SP','CSP','ACP','DCP','CP','AIG','DIG'];
const REASONS=['Bereavement','Sickness or injury','Wedding','Retirement','Emergency','Other'];
const NOTICE_TYPES=['Contribution call','Meeting or event','Promotion or news','Season’s greetings','Other'];
const STATUS={serving:'Serving',retired:'Retired',deceased:'Deceased'};

const S={members:[],contacts:{},appeals:[],payouts:[],notices:[],meta:{},admin:false,loaded:false,problem:'',view:'home',q:'',filter:'all',appeal:null,payQ:''};
S.got=new Set(); S.excos=[]; S.me=''; S.payFilter='all'; S.screen='loading'; S.rawMembers=[]; S.priv={}; S.requests=[]; S.admins=[]; S.applications=[]; S.claims=[]; S.claimsOn=false; S.claimsFor=''; S.need=6;
const CONFIG={apiKey:"AIzaSyDIh1SAWJpgX6jH641iybN_ECrV1JJUrcE",authDomain:"npf-course-55.firebaseapp.com",projectId:"npf-course-55",storageBucket:"npf-course-55.firebasestorage.app",messagingSenderId:"338572943445",appId:"1:338572943445:web:aa68a5dc993ff2e4d134dc"};
let db=null, auth=null, unsubs=[], subTimer=0, enterSeq=0;
const dl={save:async({filename,data})=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type:'text/csv'})); a.download=filename; document.body.append(a); a.click(); a.remove(); }};
const norm=v=>{ const t=String(v||''), d=t.replace(/\D/g,''); return d.length>=3?d:t.toUpperCase().replace(/[^A-Z0-9]/g,''); };
const now=()=>new Date().toISOString();
function clearData(){ S.members=[]; S.rawMembers=[]; S.priv={}; S.contacts={}; S.appeals=[]; S.payouts=[]; S.notices=[]; S.excos=[]; S.requests=[]; S.admins=[]; S.applications=[]; S.claims=[]; }
/* Public member details and exco-only details are kept apart, so members never receive Force Nos., phones or notes. */
function merge(){
  S.members=S.rawMembers.map(m=>{ const p=S.priv[m.id]||{}; return {...m,forceNo:p.forceNo||'',dob:p.dob||'',note:p.note||''}; });
  S.contacts=Object.fromEntries(Object.entries(S.priv).map(([k,p])=>[k,{phone:p.phone||''}]));
}
function stopSubs(){ unsubs.forEach(u=>u()); unsubs=[]; clearTimeout(subTimer); S.got=new Set(); S.problem=''; }
function startSubs(){
  stopSubs(); S.need=S.admin?8:7;
  subTimer=setTimeout(()=>{ if(S.got.size<S.need){ S.problem='slow'; render(); } },10000);
  const got=k=>{ S.got.add(k); S.problem=''; if(S.got.size>=S.need) clearTimeout(subTimer); };
  const dead=e=>{ clearTimeout(subTimer); if(e&&e.code==='permission-denied'){ enter(auth.currentUser); return; } S.problem='error'; render(); };
  const map=s=>s.exists&&s.data().m?Object.entries(s.data().m).map(([id,v])=>({...v,id})):[];
  const col=key=>unsubs.push(db.collection(key).onSnapshot(s=>{ S[key]=s.docs.map(x=>({...x.data(),id:x.id})); got(key); render(); },dead));
  unsubs.push(db.doc('public/members').onSnapshot(s=>{ S.rawMembers=map(s); merge(); got('members'); render(); },dead));
  ['appeals','payouts','notices','excos'].forEach(col);
  unsubs.push(db.collection('claims').onSnapshot(s=>{ S.claims=s.docs.map(x=>({...x.data(),id:x.id})); S.claimsOn=true; got('claims'); render(); },()=>{ S.claims=[]; S.claimsOn=false; got('claims'); render(); }));
  unsubs.push(db.doc('meta/course').onSnapshot(s=>{ S.meta=s.exists?s.data():{}; got('meta'); renderHead(); render(); },dead));
  if(S.admin){
    unsubs.push(db.doc('private/members').onSnapshot(s=>{ S.priv=Object.fromEntries(map(s).map(p=>[p.id,p])); merge(); got('private'); render(); },dead));
    unsubs.push(db.collection('requests').onSnapshot(s=>{ S.requests=s.docs.map(x=>({...x.data(),id:x.id})); render(); },()=>{}));
    unsubs.push(db.collection('applications').onSnapshot(s=>{ S.applications=s.docs.map(x=>({...x.data(),id:x.id})); render(); },()=>{}));

function authMsg(x){

  switch(x&&x.code){
    case 'auth/invalid-credential': case 'auth/wrong-password': case 'auth/user-not-found': case 'auth/invalid-login-credentials': return 'Wrong email or password.';
    case 'auth/invalid-email': return 'That email address does not look right.';

async function enter(u){
  const my=++enterSeq; stopSubs(); S.admin=false; S.me=''; clearData();
  try{
    if(!u){ show(['login','signup','register','applied'].includes(S.screen)?S.screen:'lock'); return; }
    if(u.isAnonymous){
      const s=await db.doc('sessions/'+u.uid).get(); if(my!==enterSeq) return;
      const r=s.exists&&s.data().no?await db.doc('roster/'+s.data().no).get():null; if(my!==enterSeq) return;
      if(!r||!r.exists){ show(['login','signup','register','applied'].includes(S.screen)?S.screen:'lock'); return; }
      S.me=r.data().mid||''; S.screen='app'; S.appeal=null; history.replaceState(null,'','#home'); renderHead(); route(); startSubs(); return;
    }
    const a=await db.doc('admins/'+u.uid).get(); if(my!==enterSeq) return;
    if(a.exists){ S.admin=true; S.screen='app'; S.appeal=null; history.replaceState(null,'','#home'); renderHead(); route(); startSubs(); return; }
    const c=await db.doc('config/claimed').get(); if(my!==enterSeq) return;
    if(!c.exists){ show('claim'); return; }
    await db.doc('requests/'+u.uid).set({email:u.email||'',name:S.signupName||u.displayName||'',at:now()}); if(my!==enterSeq) return;
    show('pending');
  }catch(e){ if(my!==enterSeq) return; show(u&&!u.isAnonymous?'login':'lock'); gateMsg(authMsg(e)); }
}

const living=()=>S.members.filter(m=>m.status!=='deceased');

function stats(a){
  const paid=Object.values(a.paid||{});
  const raised=paid.reduce((t,p)=>t+(Number(p.a)||0),0);
  const expected=(a.status==='closed'&&a.expected)?a.expected:living().length;
  const rate=expected?Math.min(100,Math.round(paid.length/expected*100)):0;
  const target=Number(a.target)||0;
  return {raised,count:paid.length,expected,rate,target,money:target?Math.min(100,Math.round(raised/target*100)):0};
}
function totals(){
  const st=S.appeals.map(stats);
  const totalIn=st.reduce((t,s)=>t+s.raised,0);
  const totalOut=S.payouts.reduce((t,p)=>t+(Number(p.amount)||0),0);
  const rated=st.filter(s=>s.expected>0);
  const rate=rated.length?Math.round(rated.reduce((t,s)=>t+s.rate,0)/rated.length):null;
  const withTarget=st.filter(s=>s.target>0);
  return {totalIn,totalOut,balance:totalIn-totalOut,rate,met:withTarget.filter(s=>s.raised>=s.target).length,withTarget:withTarget.length};
}

function upcoming(){
  const now=new Date(), y=now.getFullYear(), t0=new Date(y,now.getMonth(),now.getDate()), out=[];
  const next=md=>{ const [mo,da]=String(md).split('-').map(Number); if(!mo||!da) return null; let d=new Date(y,mo-1,da); if(d<t0) d=new Date(y+1,mo-1,da); return (d-t0)<=30*864e5?d:null; };
  for(const m of S.members){
    if(m.status==='deceased'){ const d=m.dod&&next(m.dod.slice(5)), yrs=d?d.getFullYear()-Number(m.dod.slice(0,4)):0; if(d&&yrs>0) out.push({d,m,text:'Remembrance · '+yrs+(yrs===1?' year':' years')+' since passing',cls:'closed',today:+d===+t0}); }

/* Screenshots are shrunk on the phone and kept in the database, so no paid file storage is needed. */
async function shrinkImage(file){
  const url=URL.createObjectURL(file);
  try{
    const im=await new Promise((ok,no)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=no; i.src=url; });
    for(const [side,q] of [[1100,.6],[900,.5],[700,.45],[520,.4]]){
      const k=Math.min(1,side/Math.max(im.naturalWidth,im.naturalHeight)), cv=document.createElement('canvas');
      cv.width=Math.max(1,Math.round(im.naturalWidth*k)); cv.height=Math.max(1,Math.round(im.naturalHeight*k));
      const g=cv.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,cv.width,cv.height); g.drawImage(im,0,0,cv.width,cv.height);
      const out=cv.toDataURL('image/jpeg',q); if(out.length<400000) return out;
    }
    throw new Error('too large');
  } finally { URL.revokeObjectURL(url); }
}

function myRecord(){
  const m=!S.admin&&S.me&&memberById(S.me); if(!m) return '';
  const mine=S.appeals.map(a=>({a,p:(a.paid||{})[m.id]}));
  const total=mine.reduce((t,x)=>t+(x.p?Number(x.p.a)||0:0),0), n=mine.filter(x=>x.p).length;
  const owing=mine.filter(x=>!x.p&&x.a.status!=='closed'&&!sameName(x.a.beneficiary,m.name)).map(x=>x.a);
  return `<section class="panel"><div class="pad stack"><h3>My record</h3>
    <div class="between" style="color:inherit"><h2>${esc([m.rank,m.name].filter(Boolean).join(' '))}</h2><button class="link" data-act="member" data-id="${esc(m.id)}">My payments</button></div>
    <p class="note">You have contributed ${naira(total)} in ${n} of ${S.appeals.length} appeals.</p></div>
    ${owing.length?owing.map(a=>`<button class="row" data-act="appeal" data-id="${esc(a.id)}"><span class="row-main"><b>${esc(a.title)}</b><small>${[Number(a.perMember)?'Suggested '+naira(a.perMember):'',a.deadline?'Closes '+fdate(a.deadline):''].filter(Boolean).join(' · ')}</small></span>${waiting(a.id,m.id)?'<span class="pill type">Awaiting confirmation</span>':'<span class="pill unpaid">Not paid</span>'}</button>`).join(''):'<div class="row"><span class="row-main"><small>You are up to date on every open appeal.</small></span><span class="pill paid">Up to date</span></div>'}
  </section>`;
}
function reminderText(a){
  const paid=a.paid||{}, wait=living().filter(m=>!paid[m.id]&&waiting(a.id,m.id)).length, owing=living().filter(m=>!paid[m.id]&&!waiting(a.id,m.id)&&!sameName(a.beneficiary,m.name)).sort(byName);
  const L=['*'+a.title+'*'], sub=[a.beneficiary?'For '+a.beneficiary:'',a.reason||''].filter(Boolean).join(' - ');
  if(sub) L.push(sub);
  if(Number(a.perMember)) L.push('Suggested amount: '+naira(a.perMember)+' (you may give more)');
  if(a.deadline) L.push('Closes: '+fdate(a.deadline));
  if(a.payNo||a.payBank) L.push('Pay to: '+[a.payNo,a.payBank,a.payName].filter(Boolean).join(', '));
  L.push('','Yet to pay ('+owing.length+'):',...owing.map((m,i)=>(i+1)+'. '+[m.rank,m.name].filter(Boolean).join(' ')));
  if(wait) L.push('','Awaiting confirmation: '+wait);
  L.push('','Thank you to the '+Object.keys(paid).length+' who have paid.');
  return L.join('\n');
}
const csv=rows=>'﻿'+rows.map(r=>r.map(c=>{ c=String(c??''); return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c; }).join(',')).join('\r\n');
function backupFile(kind){
  const ms=[...S.members].sort(byName), as=[...S.appeals].sort((a,b)=>String(a.opened||'').localeCompare(String(b.opened||'')));
  if(kind==='members') return csv([['Name','Rank','Force No.','Command','Status','Date of birth','Date of death','Phone','Contributed for','Own contributions','Note'],
    ...ms.map(m=>[m.name,m.rank,m.forceNo,m.command,STATUS[m.status]||'Serving',m.dob,m.dod,(S.contacts[m.id]||{}).phone,helpedFor(m).map(a=>a.reason).join('; '),as.reduce((t,a)=>t+(Number(((a.paid||{})[m.id]||{}).a)||0),0),m.note])]);
  if(kind==='contributions') return csv([['Name','Rank','Force No.',...as.map(a=>a.title+' ('+(a.opened||'')+')'),'Total'],
    ...ms.map(m=>{ const v=as.map(a=>Number(((a.paid||{})[m.id]||{}).a)||0); return [m.name,m.rank,m.forceNo,...v.map(x=>x||''),v.reduce((t,x)=>t+x,0)]; }),
    ['Total raised','','',...as.map(a=>stats(a).raised),totals().totalIn]]);
  const t=totals();
  return csv([['Date','Type','Description','In','Out'],
    ...[...as.map(a=>[a.opened,'Contributions',a.title+(a.beneficiary?' (for '+a.beneficiary+')':''),stats(a).raised,'']),

    ['','','Totals',t.totalIn,t.totalOut],['','','Balance in hand',t.balance,'']]);
}

function banner(){

  if(!S.admin) return '<div class="banner publish"><span>You are signed in with your Force No.</span><button class="link" data-act="lock">Lock</button></div>';
  const missing=S.members.filter(m=>m.status!=='deceased'&&norm(m.forceNo).length<3).length;

  return (pc?`<div class="banner publish"><span>${pc===1?'1 payment claim is':pc+' payment claims are'} waiting to be confirmed.</span><button class="btn small" data-act="claims">Review</button></div>`:'')

function route(){

function openSheet(html,onSubmit){
  sheet.innerHTML=`<form class="sheet" id="sheet-form" novalidate>${html}<p class="err" id="sheet-err" hidden></p></form>`;

  if(!sheet.open) sheet.showModal();
}

function fail(e){
  const el=$('#sheet-err'); if(!el) return;
  el.textContent=e&&e.code==='permission-denied'?'You are not allowed to change this record.':e&&e.code==='resource-exhausted'?'The free daily limit has been reached. Try again tomorrow.':(e&&e.userMessage)||'Could not save. Check your connection and try again.';
  el.hidden=false;
}

async function put(bt){
  try{ await bt.commit(); }
  catch(e){ if(e&&(e.code==='resource-exhausted'||e.code==='unavailable')){ await new Promise(r=>setTimeout(r,2500)); await bt.commit(); } else throw e; }
}
function splitRow(line,delim){
  if(delim==='\t') return line.split('\t');
  const out=[]; let cur='', q=false;
  for(let i=0;i<line.length;i++){ const c=line[i];
    if(q){ if(c==='"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=c; }
    else if(c==='"') q=true; else if(c===','){ out.push(cur); cur=''; } else cur+=c; }
  out.push(cur); return out;
}
function headerKey(h){
  h=h.toLowerCase();
  if(h.includes('kin')) return null;
  if(/phone|mobile|tel|whatsapp/.test(h)) return 'phone';
  if(/force|ap\s*no|service no/.test(h)) return 'forceNo';
  if(/death|died/.test(h)) return 'dod';
  if(/birth|dob/.test(h)) return 'dob';
  if(h.includes('rank')) return 'rank';
  if(/command|formation|station|division|posting/.test(h)) return 'command';
  if(h.includes('status')) return 'status';
  if(h.includes('name')) return 'name';
  return null;
}
function parseMembers(text){
  const lines=String(text).split(/\r?\n/).filter(l=>l.trim()); if(!lines.length) return [];
  const delim=lines[0].includes('\t')?'\t':',';
  let rows=lines.map(l=>splitRow(l,delim).map(c=>c.trim()));
  let cols=['name','rank','forceNo','command','status','phone','dob'];
  const head=rows[0].map(headerKey);
  if(head.includes('name')){ cols=head; rows=rows.slice(1); }
  return rows.map(r=>{ const m={}; cols.forEach((k,i)=>{ if(k&&m[k]===undefined) m[k]=r[i]||''; }); return m; }).filter(m=>m.name);
}
function parseDob(v){
  v=String(v||'').trim(); const p2=n=>String(n).padStart(2,'0');
  let m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return m[1]+'-'+p2(m[2])+'-'+p2(m[3]);
  m=v.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})/); if(!m) return '';
  let d=+m[1], mo=+m[2]; if(mo>12&&d<=12){ const t=d; d=mo; mo=t; }
  return mo>=1&&mo<=12&&d>=1&&d<=31?m[3]+'-'+p2(mo)+'-'+p2(d):'';
}

function matchPayments(text,defAmt,paid){
  const byNo={}, names=[];
  for(const m of S.members){ const n=norm(m.forceNo); if(n.length>=3&&!byNo[n]) byNo[n]=m.id; const nm=String(m.name||'').trim().toLowerCase(); if(nm) names.push([nm,m.id]); }
  names.sort((a,b)=>b[0].length-a[0].length);
  const out={pay:{},missed:[],already:0,total:0,noAmount:false};
  for(const line of String(text).split(/\r?\n/)){
    if(!line.trim()) continue; out.total++;
    const cells=line.split(/\t|,(?!\d{3}\b)|\s{2,}/).map(c=>c.trim()).filter(Boolean); let id='', amt=0;
    for(const c of cells){
      if(!id&&/\d/.test(c)&&byNo[norm(c)]){ id=byNo[norm(c)]; continue; }
      if(/^[₦N\s\d.,]+$/.test(c)){ const v=Number(c.replace(/[₦N,\s]/g,'')); if(v>0) amt=v; }
    }
    if(!id) for(const tok of line.split(/\s+/)){ if(/\d/.test(tok)&&byNo[norm(tok)]){ id=byNo[norm(tok)]; break; } }
    if(!id){ const low=line.toLowerCase(), hit=names.find(([nm])=>low.includes(nm)); if(hit) id=hit[1]; }
    if(!id){ out.missed.push(line); continue; }
    if(paid[id]||out.pay[id]){ out.already++; continue; }
    if(!(amt||defAmt)){ out.noAmount=true; continue; }
    out.pay[id]=amt||defAmt;
  }
  return out;
}
function bulkPaySheet(id){
  const a=S.appeals.find(x=>x.id===id); if(!a) return;
  openSheet(`<h2>Bulk payment</h2>
    <p class="note">${esc(a.title)}. Paste one member per line: a Force No. or a full name. If a line also carries an amount, that amount is used for that member.</p>
    <label>Members who paid<textarea id="b-rows" name="rows" style="min-height:170px"></textarea></label>
    <div class="two"><label>Amount for lines with no amount (₦)<input id="b-amt" name="amount" type="number" inputmode="numeric" min="0" value="${esc(a.perMember||'')}"></label><label>Date paid<input id="b-date" name="date" type="date" value="${today()}"></label></div>
    ${sheetButtons('Mark as paid')}`,
  async f=>{
    const cur=S.appeals.find(x=>x.id===id)||a, r=matchPayments(f.rows||'',Number(f.amount)||0,cur.paid||{});
    if(!r.total) throw {userMessage:'Paste at least one Force No. or name.'};
    if(r.noAmount) throw {userMessage:'Enter the amount each member paid.'};
    const add=Object.fromEntries(Object.entries(r.pay).map(([k,v])=>[k,{a:v,d:f.date||today()}])), n=Object.keys(add).length;
    if(n){ const bt=db.batch(); bt.update(db.doc('appeals/'+id),Object.fromEntries(Object.entries(add).map(([k,v])=>['paid.'+k,v])));
      S.claims.filter(x=>x.appeal===id&&add[x.mid]).slice(0,300).forEach(x=>bt.delete(db.doc('claims/'+x.id)));
      await bt.commit(); }
    if(r.missed.length){ $('#b-rows').value=r.missed.join('\n'); throw {userMessage:n+' marked as paid'+(r.already?', '+r.already+' had already paid':'')+'. The lines left in the box were not recognised. Correct them and tap again.'}; }
  });
}

  catch(e){ const t=$('#r-text'); if(t&&sheet.open){ t.focus(); t.select(); b.textContent='Selected. Now tap Copy'; } else b.textContent='Press and hold the number to copy'; }

function importForm(){
  openSheet(`<h2>Import members</h2>
    <p class="note">Copy the rows from your spreadsheet, header row included, and paste them below. Without a header row the columns are read in this order: Name, Rank, Force No., Command, Status, Phone, Date of birth. Members already in the register are skipped.</p>
    <label>Rows from the spreadsheet<textarea id="i-rows" name="rows" style="min-height:170px"></textarea></label>
    <p class="note" id="import-note"></p>
    ${sheetButtons('Import members')}`,
  async f=>{
    const rows=parseMembers(f.rows||'');
    if(!rows.length) throw {userMessage:'No members found. Paste the rows with the header row, or put the name in the first column.'};
    const key=m=>String(m.name||'').trim().toLowerCase()+'|'+String(m.forceNo||'').trim().toLowerCase();
    const have=new Set(S.members.map(key)), fresh=[];
    for(const r of rows){
      if(have.has(key(r))) continue; have.add(key(r));
      const st=(r.status||'').toLowerCase(), status=/dec|dead|late/.test(st)?'deceased':/ret/.test(st)?'retired':'serving';
      fresh.push({mid:db.collection('ids').doc().id,pub:{name:r.name,rank:r.rank||'',command:r.command||'',status,dod:status==='deceased'?parseDob(r.dod):'',bday:parseDob(r.dob).slice(5)},
        prv:{forceNo:r.forceNo||'',dob:parseDob(r.dob),note:'',phone:r.phone||''},no:status!=='deceased'?norm(r.forceNo):''});
    }
    for(let i=0;i<fresh.length;i+=200){
      const part=fresh.slice(i,i+200), bt=db.batch(), nos={};
      bt.set(db.doc('public/members'),{m:Object.fromEntries(part.map(x=>[x.mid,x.pub]))},{merge:true});
      bt.set(db.doc('private/members'),{m:Object.fromEntries(part.map(x=>[x.mid,x.prv]))},{merge:true});
      for(const x of part) if(x.no.length>=3) nos[x.no]=x.mid;
      for(const [no,mid] of Object.entries(nos)) bt.set(db.doc('roster/'+no),{mid});
      await put(bt);
      $('#import-note').textContent='Added '+Math.min(i+200,fresh.length)+' of '+fresh.length+'…';
    }
  });
}

sheet.addEventListener('submit',async e=>{
  e.preventDefault(); if(!sheet._submit||!db) return;
  const form=e.target, btn=form.querySelector('[type=submit]'), err=$('#sheet-err');
  const f=Object.fromEntries(new FormData(form)); err.hidden=true; btn.disabled=true;
  try{ await sheet._submit(f); closeSheet(); }catch(x){ fail(x); btn.disabled=false; }
});

async function remove(btn,work){
  if(!btn.dataset.armed){ btn.dataset.armed='1'; btn.textContent='Tap again to delete'; return; }
  btn.disabled=true; try{ await work(); closeSheet(); }catch(x){ fail(x); btn.disabled=false; }
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act, id=b.dataset.id;
  switch(act){
    case 'sheet-close': closeSheet(); break;
    case 'filter': S.filter=id; render(); break;
    case 'member': memberSheet(id); break;
    case 'member-new': memberForm(); break;
    case 'member-edit': memberForm(id); break;
    case 'member-del': remove(b,async()=>{ const m=memberById(id)||{}, n=norm(m.forceNo), bt=db.batch(), gone={['m.'+id]:firebase.firestore.FieldValue.delete()};
      bt.update(db.doc('public/members'),gone); bt.update(db.doc('private/members'),gone); if(n.length>=3&&m.status!=='deceased') bt.delete(db.doc('roster/'+n)); await bt.commit(); }); break;
    case 'appeal': S.appeal=id; S.payQ=''; if(S.view!=='contributions') location.hash='contributions'; else { render(); window.scrollTo(0,0); } break;
    case 'appeal-back': S.appeal=null; render(); break;
    case 'appeal-new': appealForm(); break;
    case 'appeal-edit': appealForm(id); break;
    case 'appeal-toggle': { const a=S.appeals.find(x=>x.id===id); if(!a||!db) break; b.disabled=true;
      try{ await db.doc('appeals/'+id).update(a.status==='closed'?{status:'open'}:{status:'closed',expected:living().length}); }catch(x){ b.disabled=false; } break; }
    case 'appeal-del': remove(b,async()=>{ await db.doc('appeals/'+id).delete(); S.appeal=null; }); break;
    case 'pay': paySheet(id); break;
    case 'pay-del': remove(b,()=>db.doc('appeals/'+S.appeal).update({['paid.'+id]:firebase.firestore.FieldValue.delete()})); break;
    case 'payout-new': payoutForm(); break;
    case 'payout-edit': payoutForm(id); break;
    case 'payout-del': remove(b,()=>db.doc('payouts/'+id).delete()); break;
    case 'notice-new': noticeForm(); break;
    case 'notice-edit': noticeForm(id); break;
    case 'notice-del': remove(b,()=>db.doc('notices/'+id).delete()); break;
    case 'course-edit': courseForm(); break;
    case 'import': importForm(); break;
    case 'payfilter': S.payFilter=id; render(); break;
    case 'reminder': reminderSheet(id); break;
    case 'bulkpay': bulkPaySheet(id); break;
    case 'copy': copyText(b.dataset.text,b,'Copied'); break;
    case 'copy-area': copyText($('#r-text').value,b,'Copied'); break;
    case 'backup': backupSheet(); break;
    case 'dl': if(!dl) break; b.disabled=true;
      try{ await dl.save({filename:id+'-'+today()+'.csv',data:backupFile(id)}); }
      catch(x){ if(!x||x.code!=='declined') fail({userMessage:x&&x.code==='rate_limited'?'Wait a moment, then try again.':'The download is not available here.'}); }
      b.disabled=false; break;
    case 'exco-new': excoForm(); break;
    case 'exco-edit': excoForm(id); break;
    case 'exco-del': remove(b,()=>db.doc('excos/'+id).delete()); break;
    case 'lock': memberLock(); break;
    case 'go': show(id); break;
    case 'menu': menuSheet(); break;
    case 'admins': adminsSheet(); break;
    case 'apps': appsSheet(); break;
    case 'claim-new': claimForm(id); break;
    case 'proof': proofSheet(id); break;
    case 'claims': claimsSheet(id||''); break;
    case 'claim-ok': case 'claim-all': { const all=pendingClaims().filter(c=>!S.claimsFor||c.appeal===S.claimsFor), list=act==='claim-all'?all:all.filter(c=>c.id===id); b.disabled=true;
      try{ await confirmClaims(list); claimsSheet(S.claimsFor); render(); }catch(x){ fail(x); b.disabled=false; }
      break; }
    case 'claim-no': b.disabled=true;
      try{ const bt=db.batch(); bt.update(db.doc('claims/'+id),{rejected:true,proof:false}); bt.delete(db.doc('proofs/'+id)); await bt.commit(); S.claims=S.claims.map(c=>c.id===id?{...c,rejected:true,proof:false}:c); claimsSheet(S.claimsFor); render(); }catch(x){ fail(x); b.disabled=false; }
      break;
    case 'app-ok': case 'app-all': { const list=act==='app-all'?S.applications:S.applications.filter(x=>x.id===id); b.disabled=true;
      try{ await approveApps(list); appsSheet(); render(); }catch(x){ fail(x); b.disabled=false; }
      break; }
    case 'app-no': b.disabled=true; try{ await db.doc('applications/'+id).delete(); S.applications=S.applications.filter(x=>x.id!==id); appsSheet(); render(); }catch(x){ fail(x); b.disabled=false; } break;
    case 'signout': closeSheet(); S.screen='lock'; auth.signOut(); break;
    case 'recheck': await enter(auth.currentUser); if(S.screen==='pending') gateMsg('Not approved yet. Ask an exco to approve you under Manage excos.'); break;
    case 'forgot': { const em=($('#login-email').value||'').trim();
      if(!em){ gateMsg('Type your email above first, then tap Forgot password.'); break; }
      try{ await auth.sendPasswordResetEmail(em); gateMsg('A reset link has been sent to '+em+'. Check your inbox and spam folder.',true); }catch(x){ gateMsg(authMsg(x)); }
      break; }
    case 'claim': { const u=auth.currentUser, bt=db.batch(); b.disabled=true;
      bt.set(db.doc('admins/'+u.uid),{email:u.email||'',name:S.signupName||u.displayName||'',at:now()});
      bt.set(db.doc('config/claimed'),{by:u.uid,at:now()});
      try{ await bt.commit(); await enter(u); }catch(x){ b.disabled=false; gateMsg(authMsg(x)); }
      break; }
    case 'admin-ok': { const r=S.requests.find(x=>x.id===id); if(!r) break; b.disabled=true; const bt=db.batch();
      bt.set(db.doc('admins/'+id),{email:r.email||'',name:r.name||'',at:now(),by:auth.currentUser.uid}); bt.delete(db.doc('requests/'+id));
      try{ await bt.commit(); S.requests=S.requests.filter(x=>x.id!==id); if(!S.admins.some(x=>x.id===id)) S.admins=[...S.admins,{id,email:r.email,name:r.name}]; adminsSheet(); render(); }catch(x){ fail(x); b.disabled=false; }
      break; }
    case 'admin-no': b.disabled=true; try{ await db.doc('requests/'+id).delete(); S.requests=S.requests.filter(x=>x.id!==id); adminsSheet(); render(); }catch(x){ fail(x); b.disabled=false; } break;
    case 'admin-del': remove(b,()=>db.doc('admins/'+id).delete()); break;
  }
});
document.addEventListener('submit',async e=>{
  const fid=e.target.id; if(!['unlock-form','login-form','signup-form','register-form'].includes(fid)) return;
  e.preventDefault(); const btn=e.target.querySelector('[type=submit]'), label=btn.textContent;
  gateMsg(''); btn.disabled=true; btn.textContent='Please wait…';
  try{
    if(fid==='unlock-form') await tryUnlock($('#unlock-no').value);
    else if(fid==='register-form'){
      const g=k=>$('#reg-'+k).value.trim(), name=g('name'), no=g('force');
      if(!name) throw {userMessage:'Enter your full name.'};
      if(norm(no).length<3) throw {userMessage:'Enter your Force No.'};
      if(!auth.currentUser) await auth.signInAnonymously();
      if((await db.doc('roster/'+norm(no)).get()).exists) throw {userMessage:'That Force No. is already on the register. Go back and sign in with it.'};
      await db.doc('applications/'+auth.currentUser.uid).set({name:name.slice(0,100),rank:g('rank').slice(0,40),forceNo:no.slice(0,40),command:g('command').slice(0,100),status:g('status'),phone:g('phone').slice(0,30),dob:g('dob'),at:now()});
      show('applied');
    }
    else if(fid==='login-form') await auth.signInWithEmailAndPassword($('#login-email').value.trim(),$('#login-pass').value);
    else {
      const name=$('#signup-name').value.trim(); if(!name) throw {userMessage:'Enter your name.'};
      S.signupName=name;
      const c=await auth.createUserWithEmailAndPassword($('#signup-email').value.trim(),$('#signup-pass').value);
      try{ await c.user.updateProfile({displayName:name}); }catch(x){}
    }
  }catch(x){ gateMsg(authMsg(x)); }
  if(btn.isConnected){ btn.disabled=false; btn.textContent=label; }
});
window.addEventListener('hashchange',route);

/* ---------- start ---------- */
function boot(){
  route(); renderHead();
  if(typeof firebase==='undefined'){ main.dataset.screen='x'; main.innerHTML='<div class="banner">The app could not load. Check your internet connection and open the page again.</div>'; return; }
  firebase.initializeApp(CONFIG); auth=firebase.auth(); db=firebase.firestore();
  auth.onAuthStateChanged(u=>enter(u));
}
boot();
</script>
